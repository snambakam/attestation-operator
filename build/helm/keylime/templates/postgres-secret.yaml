{{- if include "keylime.postgres.use" . -}}
{{- $pg := .Values.global.database.postgres -}}
{{- if or .Values.global.database.mysql.enable .Values.global.database.mysql.external -}}
{{- fail "global.database.postgres.external and global.database.mysql cannot both be enabled" -}}
{{- end -}}
{{- if $pg.keyVault.enabled -}}
{{- /* URLs come from Azure Key Vault through the SecretProviderClass; nothing is generated here. */ -}}
{{- if or $pg.existingSecret $pg.password -}}
{{- fail "global.database.postgres.existingSecret and password cannot be used together with global.database.postgres.keyVault.enabled" -}}
{{- end -}}
{{- else if not $pg.existingSecret -}}
{{- if not $pg.host -}}
{{- fail "global.database.postgres.host is required when global.database.postgres.external is true" -}}
{{- end -}}
{{- if not $pg.password -}}
{{- fail "global.database.postgres.password is required when global.database.postgres.external is true and neither existingSecret nor keyVault is used" -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "keylime.postgres.secret" . }}
  labels:
    {{- include "keylime.labels" . | nindent 4 }}
type: Opaque
stringData:
  KEYLIME_REGISTRAR_DATABASE_URL: {{ include "keylime.postgres.url" (dict "pg" $pg "database" $pg.registrarDatabase) | quote }}
  KEYLIME_VERIFIER_DATABASE_URL: {{ include "keylime.postgres.url" (dict "pg" $pg "database" $pg.verifierDatabase) | quote }}
{{- end -}}
{{- end -}}
