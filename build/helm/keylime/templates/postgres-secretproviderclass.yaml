{{- if include "keylime.postgres.keyVault" . }}
{{- $kv := .Values.global.database.postgres.keyVault }}
{{- if not $kv.name }}
{{- fail "global.database.postgres.keyVault.name is required when keyVault.enabled is true" }}
{{- end }}
{{- if not $kv.tenantId }}
{{- fail "global.database.postgres.keyVault.tenantId is required when keyVault.enabled is true" }}
{{- end }}
{{- if not $kv.clientId }}
{{- fail "global.database.postgres.keyVault.clientId is required when keyVault.enabled is true" }}
{{- end }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "keylime.postgres.secretProviderClass" . }}
  labels:
    {{- include "keylime.labels" . | nindent 4 }}
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: {{ $kv.clientId | quote }}
    keyvaultName: {{ $kv.name | quote }}
    tenantId: {{ $kv.tenantId | quote }}
    objects: |
      array:
        - |
          objectName: {{ $kv.registrarUrlSecretName }}
          objectType: secret
          objectAlias: KEYLIME_REGISTRAR_DATABASE_URL
        - |
          objectName: {{ $kv.verifierUrlSecretName }}
          objectType: secret
          objectAlias: KEYLIME_VERIFIER_DATABASE_URL
  # Synced into a Kubernetes secret while a pod mounts the CSI volume; the pods read it with envFrom.
  secretObjects:
    - secretName: {{ include "keylime.postgres.secret" . }}
      type: Opaque
      data:
        - objectName: KEYLIME_REGISTRAR_DATABASE_URL
          key: KEYLIME_REGISTRAR_DATABASE_URL
        - objectName: KEYLIME_VERIFIER_DATABASE_URL
          key: KEYLIME_VERIFIER_DATABASE_URL
{{- end }}
