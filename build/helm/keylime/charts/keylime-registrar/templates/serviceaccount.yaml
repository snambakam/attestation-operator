{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "registrar.serviceAccountName" . }}
  labels:
    {{- include "registrar.labels" . | nindent 4 }}
  {{- if or .Values.serviceAccount.annotations (include "keylime.postgres.keyVault" .) }}
  annotations:
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if include "keylime.postgres.keyVault" . }}
    azure.workload.identity/client-id: {{ .Values.global.database.postgres.keyVault.clientId | quote }}
    {{- end }}
  {{- end }}
{{- end }}
